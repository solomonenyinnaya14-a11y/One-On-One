name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Temporary: publishes the generated lockfile so it can be reviewed and
      # committed. Removed once package-lock.json is in the repository.
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
